<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Admin Login — Sons of Thunder Ministry</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="css/default.css">
		<link rel="stylesheet" href="css/admin.css">
	</head>

	<body>
		<div class="admin-login-page">
			<a href="index.html" class="login-home-link">STM</a>
			<div class="login-card">
				<span class="login-icon">
					<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
				</span>
				<h1 id="loginTitle">Admin Login</h1>
				<p class="login-subtitle" id="loginSubtitle">Sign in with your admin email</p>

				<!-- Login form -->
				<form id="loginForm">
					<div class="form-group">
						<label for="email">Email</label>
						<input type="email" id="email" autocomplete="username" required>
					</div>
					<div class="form-group">
						<label for="password">Password</label>
						<div class="password-wrapper">
							<input type="password" id="password" autocomplete="current-password" required>
							<button type="button" class="toggle-password" aria-label="Toggle password visibility">
								<svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
								<svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
							</button>
						</div>
					</div>
					<button type="submit" class="btn-login" id="loginBtn">Login</button>
				</form>
				<a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
				<p class="login-error" id="loginError"></p>

				<!-- Password reset form -->
				<form id="resetForm" style="display:none;">
					<div class="form-group">
						<label for="resetEmail">Email</label>
						<input type="email" id="resetEmail" autocomplete="username" required>
					</div>
					<button type="submit" class="btn-login" id="resetBtn">Send Reset Email</button>
				</form>
				<a href="#" class="back-link" id="backLink" style="display:none;">Back to login</a>
				<p class="login-error" id="resetMessage"></p>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script src="js/supabase-client.js"></script>
		<script src="js/auth.js"></script>
		<script>
		(function () {
			// Toggle password visibility
			document.querySelectorAll('.toggle-password').forEach(function (btn) {
				btn.addEventListener('click', function () {
					var input = btn.parentElement.querySelector('input');
					var eyeIcon = btn.querySelector('.eye-icon');
					var eyeOffIcon = btn.querySelector('.eye-off-icon');
					if (input.type === 'password') {
						input.type = 'text';
						eyeIcon.style.display = 'none';
						eyeOffIcon.style.display = '';
					} else {
						input.type = 'password';
						eyeIcon.style.display = '';
						eyeOffIcon.style.display = 'none';
					}
				});
			});

			var loginForm = document.getElementById('loginForm');
			var emailInput = document.getElementById('email');
			var passwordInput = document.getElementById('password');
			var loginBtn = document.getElementById('loginBtn');
			var errorEl = document.getElementById('loginError');
			var forgotLink = document.getElementById('forgotLink');
			var titleEl = document.getElementById('loginTitle');
			var subtitleEl = document.getElementById('loginSubtitle');

			var resetForm = document.getElementById('resetForm');
			var resetEmailInput = document.getElementById('resetEmail');
			var resetBtn = document.getElementById('resetBtn');
			var resetMessage = document.getElementById('resetMessage');
			var backLink = document.getElementById('backLink');

			// If already logged in, skip to dashboard
			Auth.getSession().then(function (session) {
				if (session) window.location.href = 'admin-dashboard.html';
			});

			// Login submit
			loginForm.addEventListener('submit', function (e) {
				e.preventDefault();
				errorEl.textContent = '';
				loginBtn.disabled = true;
				loginBtn.textContent = 'Signing in…';

				Auth.login(emailInput.value.trim(), passwordInput.value).then(function (res) {
					if (res.ok) {
						window.location.href = 'admin-dashboard.html';
					} else {
						errorEl.textContent = res.error || 'Incorrect email or password.';
						loginBtn.disabled = false;
						loginBtn.textContent = 'Login';
					}
				});
			});

			// Forgot password → show reset form
			forgotLink.addEventListener('click', function (e) {
				e.preventDefault();
				loginForm.style.display = 'none';
				forgotLink.style.display = 'none';
				errorEl.textContent = '';
				resetMessage.textContent = '';
				resetMessage.classList.remove('login-success');
				titleEl.textContent = 'Reset Password';
				subtitleEl.textContent = 'Enter your email — we\u2019ll send a reset link';
				resetEmailInput.value = emailInput.value;
				resetForm.style.display = '';
				backLink.style.display = '';
			});

			// Back to login
			backLink.addEventListener('click', function (e) {
				e.preventDefault();
				resetForm.style.display = 'none';
				backLink.style.display = 'none';
				resetMessage.textContent = '';
				titleEl.textContent = 'Admin Login';
				subtitleEl.textContent = 'Sign in with your admin email';
				loginForm.style.display = '';
				forgotLink.style.display = '';
			});

			// Reset submit
			resetForm.addEventListener('submit', function (e) {
				e.preventDefault();
				resetMessage.textContent = '';
				resetMessage.classList.remove('login-success');
				resetBtn.disabled = true;
				resetBtn.textContent = 'Sending…';

				Auth.sendPasswordReset(resetEmailInput.value.trim()).then(function (res) {
					resetBtn.disabled = false;
					resetBtn.textContent = 'Send Reset Email';
					if (res.ok) {
						resetMessage.textContent = 'Check your email for a reset link.';
						resetMessage.classList.add('login-success');
					} else {
						resetMessage.textContent = res.error || 'Could not send reset email.';
					}
				});
			});
		})();
		</script>
	</body>
</html>
