<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Admin Dashboard — Sons of Thunder Ministry</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="css/default.css">
		<link rel="stylesheet" href="css/admin.css">
		<link rel="stylesheet" href="css/responsiveness.css">
	</head>

	<body>
		<div class="admin-dashboard">
			<!-- Top bar -->
			<div class="admin-topbar">
				<a href="index.html" class="nav-logo">STM</a>
				<div class="admin-topbar-right">
					<a href="index.html" class="btn-logout">View Site</a>
					<button class="btn-logout" id="logoutBtn">Logout</button>
				</div>
			</div>

			<!-- Dashboard content -->
			<div class="dashboard-body">
				<!-- Left: Sermon form -->
				<div class="sermon-form-panel">
					<h2 id="formTitle">New Sermon</h2>

					<div class="form-row">
						<div class="form-group">
							<label for="sermonTitle">Title</label>
							<input type="text" id="sermonTitle" placeholder="Sermon title">
						</div>
						<div class="form-group">
							<label for="sermonAuthor">Author</label>
							<input type="text" id="sermonAuthor" placeholder="Pastor name" value="Pastor Hugh Compton">
						</div>
					</div>

					<div class="form-row">
						<div class="form-group">
							<label for="sermonYoutube">YouTube Link</label>
							<input type="url" id="sermonYoutube" placeholder="https://youtube.com/watch?v=...">
						</div>
						<div class="form-group">
							<label for="sermonDate">Date</label>
							<input type="date" id="sermonDate">
						</div>
					</div>

					<div class="form-group">
						<label>Content</label>
						<div class="editor-wrapper" id="editorWrapper"></div>
					</div>

					<button class="btn-publish" id="publishBtn">Publish Sermon</button>
					<button class="btn-cancel-edit" id="cancelEditBtn">Cancel Edit</button>
				</div>

				<!-- Right: Published sermons -->
				<div class="sermons-sidebar">
					<h2>Published Sermons</h2>
					<div class="sidebar-sermon-list" id="sidebarSermons">
						<p class="sidebar-empty">No sermons published yet.</p>
					</div>
				</div>
			</div>
		</div>

		<!-- Delete confirmation modal -->
		<div class="modal-overlay" id="deleteModal">
			<div class="modal-card">
				<h3>Delete Sermon</h3>
				<p id="deleteModalText">Are you sure you want to delete this sermon? This cannot be undone.</p>
				<div class="modal-actions">
					<button class="btn-modal-cancel" id="cancelDeleteBtn">Cancel</button>
					<button class="btn-modal-delete" id="confirmDeleteBtn">Delete</button>
				</div>
			</div>
		</div>

		<!-- Toast notification -->
		<div class="toast" id="toast"></div>

		<script src="js/auth.js"></script>
		<script src="js/sermons.js"></script>
		<script src="js/rich-editor.js"></script>
		<script>
		(function () {
			// Guard — require login
			if (!Auth.requireAuth()) return;

			// Init editor
			RichEditor.init('editorWrapper');

			// Set today's date as default
			var dateInput = document.getElementById('sermonDate');
			dateInput.value = new Date().toISOString().split('T')[0];

			// DOM references
			var titleInput = document.getElementById('sermonTitle');
			var authorInput = document.getElementById('sermonAuthor');
			var youtubeInput = document.getElementById('sermonYoutube');
			var publishBtn = document.getElementById('publishBtn');
			var cancelEditBtn = document.getElementById('cancelEditBtn');
			var formTitle = document.getElementById('formTitle');
			var sidebarEl = document.getElementById('sidebarSermons');
			var deleteModal = document.getElementById('deleteModal');
			var confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
			var cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
			var toastEl = document.getElementById('toast');

			var editingId = null;
			var deletingId = null;

			// Show toast message
			function showToast(msg) {
				toastEl.textContent = msg;
				toastEl.classList.add('visible');
				setTimeout(function () {
					toastEl.classList.remove('visible');
				}, 2500);
			}

			// Render sidebar
			function renderSidebar() {
				var sermons = Sermons.getAll();
				if (sermons.length === 0) {
					sidebarEl.innerHTML = '<p class="sidebar-empty">No sermons published yet.</p>';
					return;
				}
				var html = '';
				sermons.forEach(function (s) {
					var dateStr = s.date ? new Date(s.date + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
					html += '<div class="sidebar-sermon-item">'
						+ '<h4>' + escapeHtml(s.title) + '</h4>'
						+ '<div class="sidebar-meta">' + escapeHtml(s.author) + (dateStr ? ' &middot; ' + dateStr : '') + '</div>'
						+ '<div class="sidebar-sermon-actions">'
						+ '<button class="btn-edit-sermon" data-id="' + s.id + '">Edit</button>'
						+ '<button class="btn-delete-sermon" data-id="' + s.id + '">Delete</button>'
						+ '</div></div>';
				});
				sidebarEl.innerHTML = html;

				// Bind edit buttons
				sidebarEl.querySelectorAll('.btn-edit-sermon').forEach(function (btn) {
					btn.addEventListener('click', function () {
						startEdit(btn.getAttribute('data-id'));
					});
				});
				// Bind delete buttons
				sidebarEl.querySelectorAll('.btn-delete-sermon').forEach(function (btn) {
					btn.addEventListener('click', function () {
						deletingId = btn.getAttribute('data-id');
						var sermon = Sermons.getById(deletingId);
						document.getElementById('deleteModalText').textContent = 'Are you sure you want to delete "' + sermon.title + '"? This cannot be undone.';
						deleteModal.classList.add('active');
					});
				});
			}

			// Start editing a sermon
			function startEdit(id) {
				var sermon = Sermons.getById(id);
				if (!sermon) return;
				editingId = id;
				titleInput.value = sermon.title || '';
				authorInput.value = sermon.author || '';
				youtubeInput.value = sermon.youtubeUrl || '';
				dateInput.value = sermon.date || '';
				RichEditor.setContent(sermon.content || '');
				formTitle.textContent = 'Edit Sermon';
				publishBtn.textContent = 'Update Sermon';
				cancelEditBtn.style.display = 'block';
				window.scrollTo({ top: 0, behavior: 'smooth' });
			}

			// Cancel edit
			function cancelEdit() {
				editingId = null;
				titleInput.value = '';
				authorInput.value = 'Pastor Hugh Compton';
				youtubeInput.value = '';
				dateInput.value = new Date().toISOString().split('T')[0];
				RichEditor.clear();
				formTitle.textContent = 'New Sermon';
				publishBtn.textContent = 'Publish Sermon';
				cancelEditBtn.style.display = 'none';
			}

			// Publish / Update
			publishBtn.addEventListener('click', function () {
				var title = titleInput.value.trim();
				if (!title) {
					titleInput.focus();
					return;
				}

				var data = {
					title: title,
					author: authorInput.value.trim(),
					youtubeUrl: youtubeInput.value.trim(),
					date: dateInput.value,
					content: RichEditor.getContent()
				};

				if (editingId) {
					Sermons.update(editingId, data);
					showToast('Sermon updated');
				} else {
					Sermons.save(data);
					showToast('Sermon published');
				}
				cancelEdit();
				renderSidebar();
			});

			cancelEditBtn.addEventListener('click', cancelEdit);

			// Confirm delete
			confirmDeleteBtn.addEventListener('click', function () {
				if (deletingId) {
					Sermons.remove(deletingId);
					if (editingId === deletingId) cancelEdit();
					deletingId = null;
					deleteModal.classList.remove('active');
					renderSidebar();
					showToast('Sermon deleted');
				}
			});

			cancelDeleteBtn.addEventListener('click', function () {
				deletingId = null;
				deleteModal.classList.remove('active');
			});

			// Close modal on overlay click
			deleteModal.addEventListener('click', function (e) {
				if (e.target === deleteModal) {
					deletingId = null;
					deleteModal.classList.remove('active');
				}
			});

			// Logout
			document.getElementById('logoutBtn').addEventListener('click', function () {
				Auth.logout();
				window.location.href = 'admin-login.html';
			});

			// Escape HTML for safe rendering
			function escapeHtml(str) {
				var div = document.createElement('div');
				div.textContent = str || '';
				return div.innerHTML;
			}

			// Initial render
			renderSidebar();
		})();
		</script>
	</body>
</html>
